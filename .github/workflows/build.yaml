name: Build and Release Assets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Update theme configuration
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION=${GITHUB_REF_NAME#v}

          # Validate semantic version format (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version '$VERSION' is not a valid semantic version (X.Y.Z format)"
            echo "Expected format: X.Y.Z (e.g., 1.2.3)"
            exit 1
          fi

          echo "Valid semantic version detected: $VERSION"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          # Update komari-theme.json with new version
          jq --arg version "$VERSION" \
              '.version = $version' \
              komari-theme.json > komari-theme-updated.json

          mv komari-theme-updated.json komari-theme.json

          echo "Updated theme configuration:"
          cat komari-theme.json

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          ls -la preview.png || (echo "preview.png not found" && exit 1)
          ls -la komari-theme.json || (echo "komari-theme.json not found" && exit 1)
          ls -la dist/ || (echo "dist/ directory not found" && exit 1)
          echo "All required files found!"

      - name: Create theme package
        run: |
          # Create a temporary directory for the package
          mkdir -p theme-package

          # Copy required files
          cp preview.png theme-package/
          cp komari-theme.json theme-package/
          cp -r dist/ theme-package/

          # Create zip file with version
          ZIP_NAME="AnimalIsland-${VERSION}.zip"

          cd theme-package
          zip -r "../${ZIP_NAME}" .
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Created package: ${ZIP_NAME}"
          ls -la ${ZIP_NAME}

      - name: Generate Changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --prune --tags

          # Previous tag = newest tag that is not the tag being released
          mapfile -t TAGS < <(git tag --sort=-v:refname)
          PREVIOUS_TAG=""
          for tag in "${TAGS[@]}"; do
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              PREVIOUS_TAG="$tag"
              break
            fi
          done

          # Without a previous tag, list recent commits instead of the whole fork history
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous tag: $PREVIOUS_TAG"
            CHANGELOG=$(git log "$PREVIOUS_TAG".."$GITHUB_REF_NAME" --pretty=format:"* %s (%h)")
          else
            echo "No previous tag found, listing recent commits"
            CHANGELOG=$(git log -n 10 --pretty=format:"* %s (%h)" "$GITHUB_REF_NAME")
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: ${{ env.ZIP_NAME }}
